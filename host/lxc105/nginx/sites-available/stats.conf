# --- stats.example.com -> Netdata (102:19999 via 102 nginx) ---
server {
    listen 80;
    server_name stats.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 proxy_protocol;
    server_name stats.example.com;

    ssl_certificate /etc/letsencrypt/live/stats.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/marexcode.access.log;
    set_real_ip_from 10.0.0.1;
    real_ip_header proxy_protocol;

    auth_basic "Marexcode";
    auth_basic_user_file /etc/nginx/.htpasswd-marexcode;
    limit_req zone=ttyd burst=50 nodelay;

    location / {
        proxy_pass http://10.0.0.102:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nv_conn;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
