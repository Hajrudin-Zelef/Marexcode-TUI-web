upstream marexweb {
    server 10.0.0.102:80;
    keepalive 16;
}

# --- Marexcode Web : page + terminal + browser ---
server {
    listen 80;
    server_name marexcode.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Fallback Tailscale : Serve termine les TLS et proxifie ici en HTTP.
server {
    listen 80;
    server_name neva.example-tailnet.ts.net 10.0.0.105;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;


    root /var/www/marexcode-web;
    index index.html;

    auth_basic "Marexcode";
    auth_basic_user_file /etc/nginx/.htpasswd-marexcode;
    access_log /var/log/nginx/marexcode.access.log;
    limit_req zone=ttyd burst=50 nodelay;
    add_header Cache-Control "no-store" always;

    location = / {
        include snippets/marexcode-page-headers.conf;
        try_files /index.html =404;
    }
    location = /index.html {
        include snippets/marexcode-page-headers.conf;
        try_files /index.html =404;
    }
    location = /ssh-ui { return 301 /ssh-ui/; }
    location /ssh-ui/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self';" always;
        try_files $uri $uri/ /ssh-ui/index.html;
    }
    location = /gate/verify { return 404; }
    location /gate/ {
        limit_req zone=gate burst=10 nodelay;
        proxy_pass http://10.0.0.102:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location /terminal/ {
        proxy_pass http://10.0.0.102:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nv_conn;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location = /browser/static/custom.css {
        auth_basic off;
        proxy_pass http://marexweb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        proxy_hide_header X-Content-Type-Options;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /browser/static/assets/ {
        auth_basic off;
        proxy_pass http://marexweb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        proxy_hide_header X-Content-Type-Options;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /browser/static/img/ {
        auth_basic off;
        proxy_pass http://marexweb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        proxy_hide_header X-Content-Type-Options;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /browser/static/ {
        auth_basic off;
        proxy_pass http://marexweb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        proxy_hide_header X-Content-Type-Options;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /browser/ {
        client_max_body_size 2g;
        proxy_pass http://10.0.0.102:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nv_conn;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    # API Netdata (même origine que la page) pour la barre de monitoring
    location /metrics/ {
        proxy_pass http://10.0.0.102:80/;
        proxy_http_version 1.1;
        proxy_set_header Host stats.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2 proxy_protocol;
    server_name marexcode.example.com;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/marexcode.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marexcode.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 100m;

    root /var/www/marexcode-web;
