stream {
    map $ssl_preread_server_name $tls_backend {
        include /etc/nginx/router-map.stream;
        default 10.0.0.105:443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $tls_backend;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 30s;
    }
}
