upstream marexfb {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen 80;
    server_name marexcode.example.com neva.example-tailnet.ts.net;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;


    allow 10.0.0.105;
    allow 127.0.0.1;
    deny all;

    access_log /var/log/nginx/marexcode.access.log;
    error_log  /var/log/nginx/marexcode.error.log;

    location = /terminal  { return 301 /terminal/1/; }
    location = /terminal/ { return 301 /terminal/1/; }

    location /terminal/1/ {
        auth_request /_gate/verify; proxy_pass http://127.0.0.1:7691; include snippets/ttyd-proxy.conf; }
    location /terminal/2/ {
        auth_request /_gate/verify; proxy_pass http://127.0.0.1:7692; include snippets/ttyd-proxy.conf; }
    location /terminal/3/ {
        auth_request /_gate/verify; proxy_pass http://127.0.0.1:7693; include snippets/ttyd-proxy.conf; }
    location /terminal/4/ {
        auth_request /_gate/verify; proxy_pass http://127.0.0.1:7694; include snippets/ttyd-proxy.conf; }

    location ~ ^/browser/.*/\. {
        return 404;
    }

    location /gate/ {
        proxy_pass http://127.0.0.1:8789/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = /_gate/verify-neva {
        allow 10.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8789/verify;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    location = /_gate/verify {
        internal;
        proxy_pass http://127.0.0.1:8789/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /browser/static/custom.css {
        proxy_pass http://marexfb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /browser/static/assets/ {
        proxy_pass http://marexfb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /browser/static/img/ {
        proxy_pass http://marexfb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /browser/static/ {
        proxy_pass http://marexfb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_buffering on;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /browser/ {
        auth_request /_gate/verify;
        client_max_body_size 2g;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $marex_conn;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
