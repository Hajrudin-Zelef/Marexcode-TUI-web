# --- fichiers.example.com -> File Browser (127.0.0.1:8082) ---
server {
    listen 80;
    server_name fichiers.example.com;

    allow 10.0.0.105;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 2g;
    access_log /var/log/nginx/fichiers.access.log;
    error_log  /var/log/nginx/fichiers.error.log;

    location ~ ^/browser/.*/\. {
        return 404;
    }

    location = /_gate/verify {
        internal;
        proxy_pass http://127.0.0.1:8789/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_gate/verify;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $marex_conn;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
